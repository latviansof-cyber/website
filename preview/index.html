      const contentByLang = { en, lv }

      // ---- Language context ----
      const LanguageContext = createContext(null)
      const STORAGE_KEY = 'dla.lang'

      function detectInitialLang() {
        const stored = localStorage.getItem(STORAGE_KEY)
        if (stored === 'en' || stored === 'lv') return stored
        const navLang = (navigator.language || '').toLowerCase()
        if (navLang.startsWith('lv')) return 'lv'
        return 'en'
      }

      function LanguageProvider({ children }) {
        const [lang, setLangState] = useState('en')
        useEffect(() => {
          const initial = detectInitialLang()
          setLangState(initial)
          document.documentElement.lang = initial
        }, [])
        const setLang = useCallback((next) => {
          setLangState(next)
          localStorage.setItem(STORAGE_KEY, next)
          document.documentElement.lang = next
        }, [])
        const toggleLang = useCallback(() => setLang(lang === 'en' ? 'lv' : 'en'), [lang, setLang])
        const value = useMemo(() => ({ lang, setLang, toggleLang, t: contentByLang[lang] }), [lang, setLang, toggleLang])
        return h(LanguageContext.Provider, { value }, children)
      }

      function useLanguage() {
        const ctx = useContext(LanguageContext)
        if (!ctx) throw new Error('useLanguage must be used inside <LanguageProvider>')
        return ctx
      }

      // ---- Components ----
      function LanguageSwitcher() {
        const { lang, setLang, t } = useLanguage()
        const options = [
          { value: 'en', label: 'EN' },
          { value: 'lv', label: 'LV' },
        ]
        return h(
          'div',
          { role: 'group', 'aria-label': t.footer.languageLabel, className: 'inline-flex items-center rounded-full border border-white/20 bg-white/5 p-1 text-xs font-semibold tracking-wide' },
          options.map((opt) => {
            const active = opt.value === lang
            return h(
              'button',
              {
                key: opt.value,
                type: 'button',
                onClick: () => setLang(opt.value),
                'aria-pressed': active,
                lang: opt.value,
                className:
                  'rounded-full px-3 py-1 transition-colors ' +
                  (active ? 'bg-amber-300 text-slate-900 shadow-sm' : 'text-white/80 hover:text-white'),
              },
              opt.label,
            )
          }),
        )
      }

            { className: 'mx-auto max-w-6xl px-4 sm:px-6 lg:px-8' },
            h(
              'div',
              { className: 'mb-10 flex items-center gap-3' },
              h('span', { 'aria-hidden': 'true', className: 'h-px w-10 bg-amber-400' }),
              h('span', { className: 'text-xs font-semibold uppercase tracking-[0.18em] text-emerald-700' }, '03'),
            ),
            h(
              'div',
              { className: 'max-w-3xl' },
              h('h2', { id: 'events-title', className: 'font-serif text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl' }, t.events.title),
              h('p', { className: 'mt-4 text-pretty text-base leading-relaxed text-slate-700 sm:text-lg' }, t.events.intro),
            ),
            h(
              'ul',
              { role: 'list', className: 'mt-10 grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3' },
              t.events.items.map((event) => {
                const accent = eventAccents[event.id] || 'from-slate-100 to-slate-50 text-slate-800'
                return h(
                  'li',
                  { key: event.id, className: 'group flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md' },
                  h(
                    'span',
                    { className: `inline-flex w-fit items-center rounded-full bg-gradient-to-r px-3 py-1 text-xs font-semibold uppercase tracking-wide ${accent}` },
                    event.id.replace('-', ' '),
                  ),
                  h('h3', { className: 'mt-4 font-serif text-lg font-semibold leading-snug text-slate-900' }, event.title),
                  h('p', { className: 'mt-3 flex-1 text-sm leading-relaxed text-slate-700' }, event.body),
                )
              }),
            ),
          ),
        )
      }

      function SiteFooter() {
        const { t } = useLanguage()
        const year = new Date().getFullYear()
        return h(
          'footer',
          { className: 'bg-slate-900 text-white' },
          h(
            'div',
            { className: 'mx-auto grid max-w-6xl gap-10 px-4 py-12 sm:px-6 sm:grid-cols-2 lg:grid-cols-3 lg:px-8' },
            h(
              'div',
              null,
              h(
                'div',
                { className: 'flex items-center gap-3' },
                h(
                  'span',
                  { 'aria-hidden': 'true', className: 'flex h-10 w-10 items-center justify-center rounded-full bg-amber-300 font-serif text-lg font-bold text-slate-900' },
                  'DLA',
                ),
                h('p', { className: 'font-serif text-base font-semibold leading-snug' }, t.footer.tagline),
              ),
              h('p', { className: 'mt-4 text-sm text-white/70' }, t.footer.address),
            ),
            h(
              'div',
              null,
              h('h2', { className: 'text-xs font-semibold uppercase tracking-[0.18em] text-amber-200' }, t.nav.events),
              h(
                'ul',
                { role: 'list', className: 'mt-3 space-y-2 text-sm text-white/80' },
                t.events.items.slice(0, 3).map((event) =>
                  h(
                    'li',
                    { key: event.id },
                    h('a', { href: '#events', className: 'hover:text-amber-200' }, event.title),
                  ),
                ),
              ),
            ),
            h(
              'div',
              null,
              h('h2', { className: 'text-xs font-semibold uppercase tracking-[0.18em] text-amber-200' }, t.footer.contact),
              h(
                'ul',
                { role: 'list', className: 'mt-3 space-y-2 text-sm text-white/80' },
                h('li', null, h('a', { href: 'mailto:hello@darwinlatvians.org', className: 'hover:text-amber-200' }, 'hello@darwinlatvians.org')),
                h('li', null, h('a', { href: '#about', className: 'hover:text-amber-200' }, t.nav.about)),
                h('li', null, h('a', { href: '#history', className: 'hover:text-amber-200' }, t.nav.history)),
              ),
            ),
          ),
          h(
            'div',
            { className: 'border-t border-white/10' },
            h(
              'div',
              { className: 'mx-auto flex max-w-6xl flex-col items-start justify-between gap-2 px-4 py-4 text-xs text-white/60 sm:flex-row sm:items-center sm:px-6 lg:px-8' },
              h('p', null, `© ${year} Latvian Association of Darwin. ${t.footer.rights}`),
              h('p', null, 'Built with React + Tailwind CSS'),
            ),
          ),
        )
      }

      function App() {
        return h(
          LanguageProvider,
          null,
          h(SiteHeader, null),
          h(
            'main',
            { id: 'main', className: 'bg-white text-slate-900' },
            h(Hero, null),
            h(TextSection, { id: 'about', tone: 'muted' }),
            h(TextSection, { id: 'history' }),
            h(Events, null),
          ),
          h(SiteFooter, null),
        )
      }

      const root = createRoot(document.getElementById('root'))
      root.render(h(App, null))
    </script>
  </body>
</html>
